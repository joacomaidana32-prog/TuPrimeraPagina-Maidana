{% extends "instrumentos/base.html" %}

{% block content %}
    <h2 class="text-2xl font-bold mb-6 text-indigo-700">{{ titulo }}</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div class="p-4 bg-gray-50 rounded border border-gray-200">
            {{ form.as_p }}
        </div>
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-500 transition">
            Guardar Datos
        </button>
    </form>
{% endblock %}
